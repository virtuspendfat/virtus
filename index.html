<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Virtus</title>
<script>
  // Captura qualquer hash/query da URL e redireciona para o sistema
  var dest = 'https://virtuspendfat.github.io/virtus/virtus.html';
  var hash = window.location.hash || '';
  var search = window.location.search || '';
  if (hash) {
    window.location.replace(dest + hash);
  } else if (search) {
    window.location.replace(dest + search);
  } else {
    window.location.replace(dest);
  }
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:80px;color:#3D8A74;font-size:18px">
  Redirecionando para o Virtus...
</p>
</body>
</html>
