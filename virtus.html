<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Virtus — Gestão de Pendências de Faturamento Médico"/>
<meta name="theme-color" content="#00695C"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Virtus"/>
<link rel="manifest" href="manifest.json"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<title>Virtus — Gestão de Pendências de Faturamento</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

/* ── VARIÁVEIS ─────────────────────────────────────────── */
:root{
  --tl:#3D8A74; --tld:#2D6A5A; --tl2:#5AADA0; --tl3:#EAF5F2; --tl4:#C0DED8;
  --bg:#F5F7FA; --sf:#FFFFFF; --sf2:#F8FAFB; --bd:#E4E9EF; --bd2:#C8D3DC;
  --tx:#1A2B3C; --tx2:#4A6274; --tx3:#8FA5B4;
  --ac:#3D8A74; --ac2:#EAF5F2; --ac3:#2D6A5A;
  --bl:#2563EB; --bl2:#EFF6FF;
  --gn:#16A34A; --gn2:#F0FDF4;
  --am:#D97706; --am2:#FFFBEB;
  --rd:#DC2626; --rd2:#FEF2F2;
  --pu:#7C3AED; --pu2:#F5F3FF;
  --r:8px; --r2:12px; --r3:16px;
  --sh:0 1px 4px rgba(0,0,0,.06),0 2px 12px rgba(0,0,0,.04);
  --sh2:0 4px 24px rgba(0,0,0,.10);
  --sb-w:240px;
}

/* ── RESET ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--tx);
  font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px;}

/* ── APP SHELL ─────────────────────────────────────────── */
.app{display:flex;min-height:100vh;}

/* ── SIDEBAR ───────────────────────────────────────────── */
.sidebar{
  width:var(--sb-w);
  background:var(--sf);
  border-right:1.5px solid var(--bd);
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:100;
}
.sb-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.35);z-index:99;
}
.sb-ov.show{display:block;}
.sb-logo{
  padding:20px 18px 16px;
  border-bottom:1.5px solid var(--bd);
  display:flex;align-items:center;min-height:64px;
}
.sb-logo span{
  font-family:'Poppins',sans-serif;
  font-size:22px;font-weight:800;
  color:var(--tl);letter-spacing:-0.5px;
}
.sb-nav{overflow-y:auto;flex:1;padding:6px 0;}
.sb-section{
  padding:14px 18px 4px;
  font-size:9px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;
  color:var(--tx3);
}
.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:1px 8px;
  border-radius:var(--r2);cursor:pointer;
  color:var(--tx2);font-size:12.5px;font-weight:500;
  transition:all .15s;
}
.sb-item:hover{background:var(--tl3);color:var(--tl);}
.sb-item.active{background:var(--tl3);color:var(--tl);font-weight:700;}
.sb-ico{
  width:22px;height:22px;border-radius:6px;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--tx3);
  flex-shrink:0;transition:all .15s;
}
.sb-item:hover .sb-ico,
.sb-item.active .sb-ico{background:var(--tl);color:#fff;}
.sb-foot{
  padding:12px;border-top:1.5px solid var(--bd);
  font-size:10px;color:var(--tx3);
}
.sb-ver{text-align:center;margin-top:6px;font-size:10px;color:var(--tx3);}
.sb-user{
  background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r2);padding:11px 12px;margin-bottom:10px;
}
.sb-user-label{
  font-size:9px;text-transform:uppercase;
  letter-spacing:1px;color:var(--tx3);margin-bottom:3px;
}
.sb-user-name{font-size:12.5px;font-weight:700;color:var(--tx);}
.sb-user-email{font-size:11px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-badge{
  display:inline-flex;align-items:center;margin-top:5px;
  background:var(--tl);color:#fff;
  font-size:9px;font-weight:700;
  padding:2px 8px;border-radius:20px;letter-spacing:.5px;
}

/* ── MAIN / WRAP ───────────────────────────────────────── */
.wrap{
  margin-left:var(--sb-w);
  flex:1;display:flex;flex-direction:column;min-height:100vh;
}

/* ── TOPBAR ────────────────────────────────────────────── */
.topbar{
  height:58px;background:var(--sf);
  border-bottom:1.5px solid var(--bd);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:50;
  box-shadow:var(--sh);
}
.tb-title{font-size:15px;font-weight:700;color:var(--tx);}
.tb-sub{font-size:11px;color:var(--tx3);margin-top:1px;}
.tb-right{display:flex;align-items:center;gap:8px;}

/* ── PAGE ──────────────────────────────────────────────── */
#pg{padding:22px 26px;flex:1;}
.pg-hd{
  display:flex;align-items:flex-start;
  justify-content:space-between;margin-bottom:18px;
}
.pg-title{font-size:19px;font-weight:800;color:var(--tx);}
.pg-sub{font-size:12px;color:var(--tx3);margin-top:2px;}

/* ── BOTÕES ────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:var(--r2);
  font-size:12.5px;font-weight:600;cursor:pointer;
  border:none;transition:all .15s;white-space:nowrap;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-p{background:var(--tl);color:#fff;}
.btn-p:hover{background:var(--tld);}
.btn-s{background:var(--sf);color:var(--tx2);border:1.5px solid var(--bd);}
.btn-s:hover{border-color:var(--tl);color:var(--tl);}
.btn-d{background:var(--rd2);color:var(--rd);border:1.5px solid #fca5a5;}
.btn-d:hover{background:var(--rd);color:#fff;}
.btn-ghost{
  background:transparent;color:var(--tx3);
  border:1px solid var(--bd);border-radius:var(--r);
  width:34px;height:34px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;transition:all .15s;
}
.btn-ghost:hover{background:var(--tl3);color:var(--tl);border-color:var(--tl4);}
.btn-xs{
  padding:4px 9px;font-size:11px;border-radius:6px;
  font-weight:600;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-sm{padding:5px 12px;font-size:11.5px;}
.spin{
  width:13px;height:13px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── CARDS ─────────────────────────────────────────────── */
.card{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--r3);padding:16px 18px;box-shadow:var(--sh);
}
.c-hd{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--tl);
  border-bottom:2px solid var(--tl3);
  padding-bottom:10px;margin-bottom:14px;
}

/* ── STATS DASHBOARD ───────────────────────────────────── */
.stats-grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:12px;margin-bottom:14px;
}
.stat{
  background:var(--sf);border:1px solid var(--bd);
  border-radius:var(--r2);padding:16px 14px;box-shadow:var(--sh);
}
.stat-lbl{
  font-size:9px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--tx3);margin-bottom:8px;
}
.stat-val{font-size:26px;font-weight:800;color:var(--tx);line-height:1;}
.stat.am .stat-val{color:var(--am);}
.stat.rd .stat-val{color:var(--rd);}
.stat.gn .stat-val{color:var(--gn);}
.stat.tl .stat-val{color:var(--tl);}
.stat.pu .stat-val{color:var(--pu);}
.stat.bl .stat-val{color:var(--bl);}

/* ── FORMULÁRIOS ───────────────────────────────────────── */
label{
  display:block;font-size:11px;font-weight:600;
  color:var(--tx2);margin-bottom:4px;letter-spacing:.2px;
}
input[type=text],input[type=email],input[type=tel],
input[type=date],input[type=time],input[type=number],
input[type=password],select,textarea{
  width:100%;padding:8px 11px;
  border:1.5px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);
  font-size:13px;transition:border .15s,box-shadow .15s;
  font-family:'Plus Jakarta Sans',sans-serif;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--tl);
  box-shadow:0 0 0 3px var(--tl3);
}
textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;gap:12px;margin-bottom:12px;}
.fr2{grid-template-columns:1fr 1fr;}
.fr3{grid-template-columns:1fr 1fr 1fr;}
.fr4{grid-template-columns:1fr 1fr 1fr 1fr;}
.sw{display:flex;align-items:center;gap:8px;position:relative;}
.sw input{padding-left:32px;}
.sw-ic{position:absolute;left:10px;color:var(--tx3);font-size:13px;}

/* ── TABELAS ───────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  padding:10px 13px;text-align:left;
  font-size:9.5px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;
  color:var(--tl);background:var(--sf2);
  border-bottom:2px solid var(--tl4);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--bd);transition:background .12s;}
tbody tr:hover{background:var(--tl3);}
tbody td{padding:11px 13px;color:var(--tx);vertical-align:middle;}
.td-act{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;}

/* ── BADGES / TAGS ─────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;
}
.bag{background:var(--am2);color:var(--am);}
.bau{background:var(--bl2);color:var(--bl);}
.bfa{background:var(--gn2);color:var(--gn);}
.bpp{background:var(--rd2);color:var(--rd);}
.bpr{background:var(--tl3);color:var(--tl);}
.tag{
  display:inline-flex;align-items:center;
  padding:2px 7px;border-radius:6px;
  font-size:11px;font-weight:600;
  background:var(--sf2);color:var(--tx2);
  border:1px solid var(--bd);
}

/* ── MODAIS ────────────────────────────────────────────── */
.modal-ov{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,25,40,.45);
  display:flex;align-items:flex-start;
  justify-content:center;padding:20px 14px;
  overflow-y:auto;backdrop-filter:blur(3px);
}
.modal{
  background:var(--sf);border-radius:var(--r3);
  width:100%;max-width:980px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
  border:1px solid var(--bd);
}
.modal-hd{
  padding:16px 22px;
  border-bottom:2px solid var(--tl);
  display:flex;justify-content:space-between;align-items:center;
  background:var(--sf2);
  border-radius:var(--r3) var(--r3) 0 0;
}
.modal-title{font-size:14px;font-weight:700;color:var(--tx);}
.modal-x{
  cursor:pointer;color:var(--tx3);font-size:18px;
  padding:2px 8px;border-radius:var(--r);
  border:none;background:transparent;transition:all .15s;
}
.modal-x:hover{background:var(--rd2);color:var(--rd);}
.modal-body{padding:20px 22px;max-height:75vh;overflow-y:auto;}
.modal-ft{
  padding:12px 22px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;
  background:var(--sf2);
  border-radius:0 0 var(--r3) var(--r3);
}

/* ── ABAS ──────────────────────────────────────────────── */
.tabs{
  display:flex;border-bottom:2px solid var(--bd);
  margin-bottom:16px;overflow-x:auto;
}
.tab{
  padding:9px 13px;font-size:11.5px;font-weight:500;
  color:var(--tx3);cursor:pointer;
  border-bottom:2.5px solid transparent;margin-bottom:-2px;
  white-space:nowrap;transition:all .15s;
  background:none;border-top:none;border-left:none;border-right:none;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.tab:hover{color:var(--tl);}
.tab.active{color:var(--tl);font-weight:700;border-bottom-color:var(--tl);}

/* ── ALERTAS ───────────────────────────────────────────── */
.alert{
  padding:10px 14px;border-radius:var(--r);
  font-size:12px;font-weight:500;margin-bottom:10px;
}
.al-s{background:var(--gn2);color:var(--gn);border:1px solid #bbf7d0;}
.al-d{background:var(--rd2);color:var(--rd);border:1px solid #fca5a5;}
.al-w{background:var(--am2);color:var(--am);border:1px solid #fde68a;}
.al-i{background:var(--bl2);color:var(--bl);border:1px solid #bfdbfe;}

/* ── TOP ALERT FLUTUANTE ───────────────────────────────── */
#top-alert{
  position:fixed;top:16px;left:50%;
  transform:translateX(-50%);z-index:9999;
  min-width:260px;max-width:440px;
  text-align:center;box-shadow:var(--sh2);
  border-radius:var(--r2);display:none;
  font-weight:600;font-size:13px;padding:11px 20px;
}
#top-alert.show{display:block;}

/* ── SETUP / LOGIN ─────────────────────────────────────── */
.setup{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;width:100%;
  background:linear-gradient(140deg,var(--tld) 0%,var(--tl) 55%,var(--tl2) 100%);
}
.setup-card{
  background:var(--sf);border-radius:20px;
  padding:38px 34px;width:100%;max-width:400px;
  box-shadow:0 24px 64px rgba(0,0,0,.22);
}
.setup-logo{text-align:center;margin-bottom:6px;}
.setup-logo span{
  font-family:'Poppins',sans-serif;
  font-size:28px;font-weight:800;color:var(--tl);
  letter-spacing:-0.5px;
}
.setup-sub{
  text-align:center;font-size:12px;
  color:var(--tx3);margin-bottom:22px;
}
.setup-note{
  margin-top:18px;font-size:11px;color:var(--tx3);
  background:var(--sf2);border-radius:var(--r);
  padding:12px;border:1px solid var(--bd);line-height:1.6;
}
.setup-note a{color:var(--tl);text-decoration:none;}

/* ── VAZIO ─────────────────────────────────────────────── */
.empty{text-align:center;padding:50px 20px;color:var(--tx3);}
.empty h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--tx2);}
.empty p{font-size:12.5px;}

/* ── AGENDA ────────────────────────────────────────────── */
.ag-item{
  display:flex;align-items:center;gap:13px;
  padding:12px 15px;border-radius:var(--r2);
  border:1px solid var(--bd);background:var(--sf);
  margin-bottom:8px;box-shadow:var(--sh);transition:box-shadow .15s;
}
.ag-item:hover{box-shadow:var(--sh2);}
.ag-date{
  min-width:44px;height:44px;border-radius:var(--r);
  background:var(--tl);color:#fff;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex-shrink:0;
}
.ag-d{font-size:15px;font-weight:800;line-height:1;}
.ag-m{font-size:9px;font-weight:600;letter-spacing:.5px;}
.ag-content{flex:1;min-width:0;}
.ag-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px;}
.ag-sub{font-size:11px;color:var(--tx3);}

/* ── MAIN / CONTENT ───────────────────────────────────── */
.main{
  margin-left:var(--sb-w);
  flex:1;display:flex;flex-direction:column;min-height:100vh;
}
.content{
  padding:22px 26px;flex:1;
}

/* ── DOSSIÊ ────────────────────────────────────────────── */
.dos-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0;}
.dos-fase{
  background:var(--sf2);border:1px solid var(--bd);
  border-radius:var(--r2);padding:14px;text-align:center;
}
.dos-fase-label{
  font-size:9px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--tx3);margin-bottom:5px;
}
.dos-fase-val{font-size:16px;font-weight:800;color:var(--tl);}

/* ── PRINT ─────────────────────────────────────────────── */
/* ── DOSSIÊ ────────────────────────────────────────────── */
.dos-page{
  position:fixed;inset:0;z-index:300;
  background:#fff;overflow-y:auto;
}
.dos-inner{
  max-width:1100px;margin:0 auto;padding:30px 40px;
}
.dos-sec{margin-bottom:22px;}

/* ── PRINT ─────────────────────────────────────────────── */
@media print{
  .sidebar,.topbar,.btn,.no-print,.tb-right{display:none!important;}
  .main{margin-left:0!important;}
  #pg{padding:0!important;}
  .dos-page{position:static;}
}
</style>

<div id="app"></div>
<script>
"use strict";
const SBU='vt_url',SBK='vt_key';
// Credenciais pré-configuradas
(function(){
  if(!localStorage.getItem(SBU)){
    localStorage.setItem(SBU,'https://etjkyqfruakhuhmrfbah.supabase.co');
    localStorage.setItem(SBK,'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0amt5cWZydWFraHVobXJmYmFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDYxNDYsImV4cCI6MjA5NTQ4MjE0Nn0.iN8BCXECUcV-xQRjgWm9xHPMMzThjV6hMWl0ZvvIXGs');
  }
})();

/* ── DB REST ─────────────────────────────────────────────── */
const DB={
  url:'',key:'',
  init(u,k){this.url=u.replace(/\/$/,'');this.key=k;},
  hd(){const tk=localStorage.getItem('vt_token');const base={'Content-Type':'application/json','apikey':this.key,'Prefer':'return=representation'};base['Authorization']='Bearer '+(tk||this.key);return base;},
  async req(method,table,opts={}){
    let path='/rest/v1/'+table;
    const p=[];
    if(opts.select)p.push('select='+opts.select);
    if(opts.order)p.push('order='+opts.order);
    if(opts.limit)p.push('limit='+opts.limit);
    if(opts.eq)Object.entries(opts.eq).forEach(([k,v])=>p.push(k+'=eq.'+encodeURIComponent(v)));
    if(p.length)path+='?'+p.join('&');
    const fo={method,headers:this.hd()};
    if(opts.body)fo.body=JSON.stringify(opts.body);
    const res=await fetch(this.url+path,fo);
    const txt=await res.text();
    let data=null;try{data=txt?JSON.parse(txt):null;}catch(e){}
    if(!res.ok)return{data:null,error:data||{message:'HTTP '+res.status+': '+txt.substring(0,200)}};
    return{data,error:null};
  },
  sel(t,o){return this.req('GET',t,o);},
  ins(t,b){return this.req('POST',t,{body:b});},
  upd(t,b,eq){const{id,created_at,...rest}=b;return this.req('PATCH',t,{body:rest,eq});},
  del(t,eq){return this.req('DELETE',t,{eq});},
  async test(){
    try{
      const r=await fetch(this.url+'/rest/v1/devedores?limit=1',{headers:this.hd()});
      const txt=await r.text();
      if(r.status===200||r.status===206)return{ok:true};
      if(r.status===401)return{ok:false,msg:'HTTP 401 - Chave invalida.'};
      if(r.status===403)return{ok:false,msg:'HTTP 403: '+txt.substring(0,150)};
      if(r.status===404)return{ok:false,msg:'HTTP 404 - URL nao encontrada.'};
      if(txt.includes('relation')||txt.includes('does not exist'))return{ok:false,msg:'TABELAS'};
      return{ok:false,msg:'HTTP '+r.status+': '+txt.substring(0,200)};
    }catch(e){return{ok:false,msg:'Falha: '+e.message+' | URL: '+this.url};}

function fmtAbbr(v){
  // Exibe valor abreviado: >=1000 → "R$ 42,3K", >=1000000 → "R$ 1,2M"
  if(typeof v==='number'){
    if(v>=1000000)return 'R$ '+(v/1000000).toFixed(1).replace('.',',')+'M';
    if(v>=1000)return 'R$ '+(v/1000).toFixed(1).replace('.',',')+'K';
    return fmt$(v);
  }
  // Para qtd (número inteiro)
  return String(v);
}
const fmtD=function(d){
  if(!d)return '--';
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(d))return d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  try{return new Date(d+'T00:00:00').toLocaleDateString('pt-BR');}catch(e){return d;}
};
const toISO=function(d){
  if(!d)return '';
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(d)){var p=d.split('/');return p[2]+'-'+p[1]+'-'+p[0];}
  return d;
};

async function salvarNovaSenha(){
  var senha=(document.getElementById('nova-senha')||{}).value||'';
  var conf=(document.getElementById('conf-senha')||{}).value||'';
  if(senha.length<6){renderDefinirSenha('A senha deve ter no mínimo 6 caracteres.');return;}
  if(senha!==conf){renderDefinirSenha('As senhas não coincidem.');return;}
  var btn=document.getElementById('btn-definir-senha');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Salvando...';}
  try{
    var r=await fetch(DB.url+'/auth/v1/user',{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'apikey':DB.key,
        'Authorization':'Bearer '+localStorage.getItem('vt_token')
      },
      body:JSON.stringify({password:senha})
    });
    if(r.ok){
      await loadData();
      renderApp();
      showAlert('Senha definida com sucesso! Bem-vindo ao Virtus!','success');
    } else {
      var d=await r.json();
      renderDefinirSenha('Erro: '+(d.error_description||d.msg||'Falha ao definir senha.'));
    }
  }catch(e){
    renderDefinirSenha('Erro: '+e.message);

}

async function doConnect(){
  let url=(document.getElementById('sb-url').value||localStorage.getItem(SBU)||'').trim();
  let key=(document.getElementById('sb-key').value||localStorage.getItem(SBK)||'').trim();
  if(!url||!key){renderSetup('Preencha URL e chave.');return;}
  if(!url.startsWith('http'))url='https://'+url;
  const btn=document.getElementById('btn-conn');
  btn.innerHTML='<span class="spin"></span> Conectando...';btn.disabled=true;
  DB.init(url,key);
  const res=await DB.test();
  if(!res.ok){
    renderSetup(res.msg==='TABELAS'?'Conexao OK! Execute o SQL Schema abaixo para criar as tabelas.':res.msg);
    return;
  }
  localStorage.setItem(SBU,url);localStorage.setItem(SBK,key);
  renderSetup(); // Mostrar tela de login após configurar
}

async function doLogin(){
  const emailEl=document.getElementById('login-email');
  const passEl=document.getElementById('login-pass');
  const btnEl=document.getElementById('btn-login');
  const email=(emailEl?emailEl.value:'').trim();
  const pass=passEl?passEl.value:'';
  if(!email||!pass){renderSetup('Preencha e-mail e senha.');return;}
  if(btnEl){btnEl.innerHTML='<span class="spin"></span> Entrando...';btnEl.disabled=true;}
  const r=await DB.signIn(email,pass);
  if(!r.ok){
    renderSetup(r.msg||'E-mail ou senha incorretos.');
    return;
  }
  // Salvar token
  localStorage.setItem('vt_token',r.token);
  localStorage.setItem('vt_refresh',r.refresh);
  // Buscar perfil do usuário na tabela usuarios
  const perfil=await carregarPerfil(r.user.id,email);
  S.user={
    id:r.user.id,          // Supabase Auth UID
    db_id:perfil?perfil.id:'', // ID na tabela usuarios
    email:email,
    nome:perfil?perfil.nome:email.split('@')[0],
    perfil:perfil?perfil.perfil:'admin'
  };
  localStorage.setItem('vt_user',JSON.stringify(S.user));
  await loadData();
  renderApp();
}

async function loadData(){
  S.loading=true;
  const[rd,rc,rp,rpt,ru]=await Promise.all([
    DB.sel('devedores',{select:'*',order:'razao_social'}),
    DB.sel('cirurgias',{select:'*',order:'created_at.desc'}),
    DB.sel('produtos',{select:'*',order:'referencia'}),
    DB.sel('protocolos',{select:'*',order:'nome'}),
    DB.sel('usuarios',{select:'*',order:'nome'})
  ]);
  S.prods=(rp.data||[]);
  S.usuarios=(ru&&ru.data)?ru.data:[];
  S.protos=(rpt.data||[]).map(function(p){return Object.assign({},p,{itens:pJ(p.itens)});});
  S.devs=(rd.data||[]).map(d=>({...d,contatos:pJ(d.contatos)}));
  S.cirs=(rc.data||[]).map(function(c){
    // Extrair campo _meta embutido em mat_orcado (fallback de persistência)
    var matOrc=pJ(c.mat_orcado);
    var metaEl=matOrc.find(function(m){return m._meta;});
    var metaResp=metaEl&&metaEl._responsaveis?metaEl._responsaveis:{};
    // Campo responsaveis dedicado no banco (se existir)
    var resp=pJ(c.responsaveis)||{};
    // Resolver array de solicitantes para cada fase
    function getResp(key){
      var fc=Array.isArray(resp[key])?resp[key]:(resp[key]&&resp[key].sol?[resp[key]]:[]);
      var fm=Array.isArray(metaResp[key])?metaResp[key]:(metaResp[key]&&metaResp[key].sol?[metaResp[key]]:[]);
      return fc.length>0?fc:(fm.length>0?fm:[]);
    }
    return Object.assign({},c,{arquivada:!!c.arquivada,caso_id:c.caso_id||'',
      mat_orcado:matOrc.filter(function(m){return !m._meta;}),
      mat_autorizado:pJ(c.mat_autorizado),
      mat_utilizado:pJ(c.mat_utilizado),
      mat_fat_autorizado:pJ(c.mat_fat_autorizado),
      mat_faturado:pJ(c.mat_faturado),
      evidencias_pre:pJ(c.evidencias_pre),
      evidencias_pos:pJ(c.evidencias_pos),
      atividades:pJ(c.atividades),
      historico_encerramento:pJ(c.historico_encerramento),
      responsaveis:resp,
      resp_orcado:getResp('orcado'),
      resp_autorizado:getResp('autorizado'),
      resp_utilizado:getResp('utilizado'),
      resp_fat_autorizado:getResp('fat_autorizado'),
      resp_faturado:getResp('faturado')
    });
  });
  S.loading=false;
}

// Mapa de permissões por perfil
const PERMS={
  admin:{
    pages:['dashboard','cirurgias','clientes','agenda','relatorios',
           'importar','produtos','protocolos','arquivadas','usuarios'],
    acoes:['criar_cir','editar_cir','arquivar_cir','excluir_cir',
           'gerir_usuarios','exportar','editar_clientes',
           'editar_produtos','editar_protocolos']
  },
  operador:{
    pages:['dashboard','cirurgias','clientes','agenda','relatorios',
           'produtos','protocolos','arquivadas'],
    acoes:['criar_cir','editar_cir','exportar',
           'editar_clientes','editar_produtos','editar_protocolos']
  },
  visualizador:{
    pages:['dashboard','cirurgias','agenda','relatorios','arquivadas'],
    acoes:[]
  }
};

function getPerfil(){
  return (S.user&&S.user.perfil)||'visualizador';
}

function canPage(page){
  var p=PERMS[getPerfil()];
  return p&&p.pages.indexOf(page)>=0;
}

function canDo(acao){
  var p=PERMS[getPerfil()];
  return p&&p.acoes.indexOf(acao)>=0;
}

// Redireciona para dashboard se sem permissão
function guardPage(page){
  if(!canPage(page)){
    showAlert('Acesso restrito para seu perfil.','warn');
    S.page='dashboard';
    renderApp();
    return false;
  }
  return true;
}


function renderPage(){
  if(!guardPage(S.page))return;
  if(S.page==='dashboard')renderDash();
  else if(S.page==='cirurgias')renderCirs();
  else if(S.page==='clientes')renderClients();
  else if(S.page==='agenda')renderAgenda();
  else if(S.page==='relatorios')renderRel();
  else if(S.page==='importar')renderImportar();
  else if(S.page==='produtos')renderProdutos();
  else if(S.page==='protocolos')renderProtocolos();
  else if(S.page==='arquivadas')renderArquivadas();
  else if(S.page==='usuarios')renderUsuarios();
}

// buildDonut — global para uso em dashboard e agenda
function buildDonut(data,label,fmt_fn,centerFmt){
    const total=data.reduce((s,d)=>s+d.v,0);
    if(total===0)return '<div style="text-align:center;padding:20px;color:var(--tx3);font-size:12px">Sem dados</div>';
    const cores=['#009688','#1565C0','#E65100','#4527A0','#C62828','#2E7D32','#F57F17'];
    let ang=0;
    const R=44, r=24; // raio externo e interno (rosca)
    const slices=data.map((d,i)=>{
      const pct=d.v/total;
      const startAng=ang; ang+=pct*2*Math.PI;
      // Arcos externos e internos para rosca
      const ox1=50+R*Math.cos(startAng-Math.PI/2);
      const oy1=50+R*Math.sin(startAng-Math.PI/2);
      const ox2=50+R*Math.cos(ang-Math.PI/2);
      const oy2=50+R*Math.sin(ang-Math.PI/2);
      const ix1=50+r*Math.cos(ang-Math.PI/2);
      const iy1=50+r*Math.sin(ang-Math.PI/2);
      const ix2=50+r*Math.cos(startAng-Math.PI/2);
      const iy2=50+r*Math.sin(startAng-Math.PI/2);
      const large=pct>0.5?1:0;
      const cor=cores[i%cores.length];
      const path='M'+ox1+','+oy1+' A'+R+','+R+',0,'+large+',1,'+ox2+','+oy2
        +' L'+ix1+','+iy1+' A'+r+','+r+',0,'+large+',0,'+ix2+','+iy2+' Z';
      return {path,cor,label:d.lbl,v:d.v,pct:Math.round(pct*100)};
    });
    const svgSlices=slices.map(s=>'<path d="'+s.path+'" fill="'+s.cor+'" stroke="#fff" stroke-width="1.5"><title>'+esc(s.label)+': '+fmt_fn(s.v)+' ('+s.pct+'%)</title></path>').join('');
    // Texto central com total
    const cfmt=centerFmt||fmt_fn;
    const totalStr=cfmt(total);
    const totalFull=fmt_fn(total); // valor completo para tooltip
    // Texto central em 2 linhas: valor abreviado + tooltip com valor completo
    const line1FontSize=totalStr.length>10?'6.5':totalStr.length>7?'7':'8';
    const totalTxt=data.length>0
      ?'<title>'+totalFull+'</title>'
       +'<text x="50" y="46" text-anchor="middle" font-size="'+line1FontSize+'" font-weight="800" fill="var(--tld)">'+totalStr+'</text>'
       +'<text x="50" y="56" text-anchor="middle" font-size="6.5" fill="var(--tx3)">total</text>'
      :''
    const legend=slices.slice(0,7).map(s=>'<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px"><span style="width:11px;height:11px;border-radius:3px;background:'+s.cor+';flex-shrink:0"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)">'+esc(s.label)+'</span><strong style="color:var(--tx)">'+s.pct+'%</strong></div>').join('');
    return '<div style="display:flex;align-items:center;gap:14px">'
      +'<svg width="140" height="140" viewBox="0 0 100 100">'+svgSlices+totalTxt+'</svg>'
      +'<div style="flex:1">'+legend+'</div>'
      +'</div>';
  }

  const fa=S.cirs.filter(c=>c.status==='Totalmente Faturado'||c.status==='faturado').length;
  const pp=S.cirs.filter(c=>c.status==='Pendencia de Pagamento'||c.status==='pag_pendente').length;

  const cr=S.cirs.filter(c=>c.status==='Cobranca Recusada').length;
  const pe=S.cirs.filter(c=>c.status==='Pedido de Esclarecimento').length;

  const fat=S.cirs.reduce((s,c)=>s+matTot(c.mat_faturado),0);
  // Saldo F6: pendente de faturamento = utilizado - faturado
  const pendFat=S.cirs.reduce((s,c)=>{
    const saldo=matTot(c.mat_utilizado)-matTot(c.mat_faturado);
    return s+(saldo>0?saldo:0);
  },0);

  const ult=S.cirs.slice(0,8).map(c=>{

  const hoje=new Date().toISOString().split('T')[0];
  const proxAcoes=[];
  S.cirs.forEach(c=>{(c.atividades||[]).forEach(a=>{
    if(a.data_proximo&&a.data_proximo>=hoje&&a.proximo_passo){
      proxAcoes.push({data:a.data_proximo,passo:a.proximo_passo,paciente:c.paciente,cid:c.id});
    }
  });});
  proxAcoes.sort((a,b)=>a.data.localeCompare(b.data));
  const agH=proxAcoes.slice(0,4).map(a=>{
    const d=new Date(a.data+'T00:00:00');
    return '<div class="ag-item"><div class="ag-date"><div class="ag-d">'+String(d.getDate()).padStart(2,'0')+'</div>'
      +'<div class="ag-m">'+d.toLocaleString('pt-BR',{month:'short'}).toUpperCase()+'</div></div>'
      +'<div class="ag-content"><div class="ag-title">'+esc(a.passo)+'</div>'
      +'<div class="ag-sub">'+esc(a.paciente)+'</div></div></div>';
  }).join('')||'<p style="font-size:12px;color:var(--tx3);padding:8px 0">Nenhuma acao agendada.</p>';

  // ── Gráfico de Barras Verticais — Cirurgias por Status ──
  const statusData=[
    {k:'Aguardando Autorizacao de Faturamento',v:ag,lbl:'Aguardando',cor:'var(--am)'},
    {k:'Faturamento Autorizado',v:au,lbl:'Autorizado',cor:'var(--tl)'},
    {k:'Totalmente Faturado',v:fa,lbl:'Faturado',cor:'var(--pu)'},
    {k:'Pendencia de Pagamento',v:pp,lbl:'Pgto.Pend.',cor:'var(--rd)'},
    {k:'Processo Concluido',v:pr,lbl:'Concluido',cor:'var(--gn)'},
    {k:'Cobranca Recusada',v:cr,lbl:'Recusada',cor:'var(--rd)'},
    {k:'Pedido de Esclarecimento',v:pe,lbl:'Esclarec.',cor:'var(--am)'},
  ];
  const maxBar=Math.max(...statusData.map(d=>d.v),1);
  const barW=42, barGap=14, chartH=120, svgW=statusData.length*(barW+barGap)+barGap;
  const barsSVG='<svg width="100%" viewBox="0 0 '+svgW+' '+(chartH+44)+'" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">'
    +statusData.map((d,i)=>{
      const x=barGap+i*(barW+barGap);
      const bh=maxBar>0?Math.round((d.v/maxBar)*chartH):0;
      const y=chartH-bh;
      return '<g>'
        +'<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+d.cor+'" opacity="0.85"/>'
        +(d.v>0?'<text x="'+(x+barW/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+d.cor+'">'+d.v+'</text>':'')
        +'<text x="'+(x+barW/2)+'" y="'+(chartH+14)+'" text-anchor="middle" font-size="9" fill="var(--tx3)">'+d.lbl+'</text>'
        +'</g>';
    }).join('')
    +'</svg>';

  // ── Gráfico de Rosca — Valor Utilizado por Fonte Pagadora ──


  // Rosca 1: Valor Pendente de Faturamento (F6) por Cliente
  const byClinteVal={};

    const saldo=matTot(c.mat_utilizado)-matTot(c.mat_faturado);

        :(hDev?hDev.razao_social:(oDev?oDev.razao_social:'Nao informado'));
      byClinteVal[cliente]=(byClinteVal[cliente]||0)+saldo;
    }
  });
  const donut1Data=Object.entries(byClinteVal).filter(([,v])=>v>0).map(([k,v])=>({lbl:k,v})).sort((a,b)=>b.v-a.v);

  // Rosca 2: Qtd Cirurgias com Saldo F6 > 0 por Cliente
  const byClienteQtd={};
  S.cirs.forEach(c=>{
    const saldo=matTot(c.mat_utilizado)-matTot(c.mat_faturado);
    if(saldo>0){
      var hDev=S.devs.find(d=>d.id===c.hospital_id);

      var fp=c.fonte_pagadora||'';
      var cliente=fp==='Hospital'?(hDev?hDev.razao_social:'Hospital nao informado')
        :fp==='Operadora'?(oDev?oDev.razao_social:'Operadora nao informada')
        :fp==='Paciente'?'Paciente'
        :(hDev?hDev.razao_social:(oDev?oDev.razao_social:'Nao informado'));
      byClienteQtd[cliente]=(byClienteQtd[cliente]||0)+1;
    }
  });
  const donut2Data=Object.entries(byClienteQtd).filter(([,v])=>v>0).map(([k,v])=>({lbl:k,v})).sort((a,b)=>b.v-a.v);

  setHTML('pg',
    '<div class="stats-grid" style="grid-template-columns:repeat(6,1fr)">'
    +'<div class="stat"><div class="stat-lbl">Aguardando</div><div class="stat-val" style="color:var(--tx)">'+ag+'</div></div>'
    +'<div class="stat"><div class="stat-lbl">Fat. Autorizado</div><div class="stat-val tl">'+au+'</div></div>'
    +'<div class="stat"><div class="stat-lbl">Fat. Realizado</div><div class="stat-val" style="color:var(--tx)">'+fa+'</div></div>'
    +'<div class="stat"><div class="stat-lbl">Pgto. Pendente</div><div class="stat-val" style="color:var(--tx)">'+pp+'</div></div>'
    +'<div class="stat"><div class="stat-lbl">Pgto. Realizado</div><div class="stat-val" style="color:var(--tx)">'+pr+'</div></div>'
    +'<div class="stat"><div class="stat-lbl">Cirurgias</div><div class="stat-val">'+S.cirs.length+'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">'
    +'<div class="card" style="padding:16px 20px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="stat-lbl" style="margin:0">Total Pendente de Faturamento</div><div style="font-size:22px;font-weight:700;color:var(--tl)">'+fmt$(pendFat)+'</div></div></div>'
    +'<div class="card" style="padding:16px 20px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="stat-lbl" style="margin:0">Total Faturado</div><div style="font-size:22px;font-weight:700;color:var(--tx)">'+fmt$(fat)+'</div></div></div>'
    +'</div>'
    // GRÁFICOS NO CENTRO
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px">'
    +'<div class="card"><div class="c-hd">Cirurgias por Status</div>'
    +'<div style="overflow-x:auto;padding:4px 0">'+barsSVG+'</div>'
    +'</div>'
    +'<div class="card"><div class="c-hd">Pendente de Faturamento por Cliente (R$)</div>'

    // TABELA E AGENDA EMBAIXO
    +'<div class="dash-grid">'
    +'<div class="card"><div class="c-hd">Ultimas Cirurgias</div>'
    +(S.cirs.length===0?'<div class="empty"><h3>Nenhuma cirurgia cadastrada</h3></div>'
      :'<div class="tbl-wrap"><table><thead><tr><th>Paciente</th><th>Hospital</th><th>Data</th><th>Status</th><th>Vl.Utilizado</th></tr></thead><tbody>'+ult+'</tbody></table></div>')

  return '<div class="c-hd" style="margin-top:8px">Documentos Recebidos ('+aprovs.length+')</div>'

    +aprovs.map(function(a){
      var bg=a.tipo==='solicitar_ajuste'?'var(--am2)':'var(--gn2)';
      var cor=a.tipo==='solicitar_ajuste'?'var(--am)':'var(--gn)';

        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
        +'<div>'
        +'<span style="font-size:13px;font-weight:700;color:'+cor+'">'+tipoLabel+'</span>'
        +(a.doc_tipo?'<span style="font-size:11px;font-weight:600;background:'+cor+';color:#fff;padding:1px 8px;border-radius:10px;margin-left:8px">'+esc(a.doc_tipo)+'</span>':'')
        +'</div>'
        +'<span style="font-size:10px;color:var(--tx3)">'+new Date(a.aprovado_em).toLocaleString('pt-BR')+'</span>'
        +'</div>'
        +'<div style="font-size:12px;color:var(--tx2);margin-bottom:6px">Por: <strong>'+esc(a.aprovado_por)+'</strong></div>'
        +(a.observacao?'<div style="font-size:12px;color:var(--tx2);margin-bottom:8px">Obs: '+esc(a.observacao)+'</div>':'')

          ?'<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.6);border-radius:var(--r);border:1px solid rgba(0,0,0,.1)">'
            +'<span style="font-size:18px">&#128196;</span>'

            +'<div style="font-size:12px;font-weight:600;color:var(--tx)">'+esc(a.doc_nome)+'</div>'
            +'<div style="font-size:10px;color:var(--tx3)">Documento anexado pelo cliente</div>'
            +'</div>'
            +'<a href="'+a.doc_data+'" download="'+esc(a.doc_nome)+'" style="font-size:11px;color:var(--tl);font-weight:700;text-decoration:none;padding:4px 10px;border:1px solid var(--tl4);border-radius:var(--r)">&#11015; Baixar</a>'
            +'</div>'
          :'')
        +'</div>';
    }).join('')
    +'</div>';
}

// ── Chat do caso — visão do cobrador ────────────────────────

    ?'<div style="text-align:center;padding:24px;color:var(--tx3);font-size:12px">Nenhuma mensagem ainda.</div>'

        +'<div style="font-size:10px;font-weight:700;color:'+(isCob?'var(--tl)':'var(--tx3)')+';margin-bottom:4px">'+esc(m.autor_nome)+'</div>'

// ── Carregar mensagens do caso para o cobrador ────────────────
async function carregarMsgsCaso(){
  if(!CF.id)return;
  var r=await DB.sel('caso_mensagens',{
    select:'*',
    eq:{cirurgia_id:CF.id},
    order:'created_at.asc'
  });
  CF._msgs=(r.data||[]);
}

// ── Enviar mensagem como cobrador ─────────────────────────────
async function enviarMsgCobrador(){
  var inp=document.getElementById('chat-cobrador-inp');
  var txt=(inp?inp.value:'').trim();
  if(!txt)return;
  var btn=document.getElementById('btn-chat-cobrador-send');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>';}

  var r=await DB.ins('caso_mensagens',{
    caso_id:CF.caso_id,
    cirurgia_id:CF.id,
    autor_tipo:'cobrador',
    autor_nome:(S.user&&S.user.nome)||'Cobrador',
    autor_uid:(S.user&&S.user.id)||null,
    mensagem:txt,
    lida:false
  });

  if(r.error){
    showAlert('Erro ao enviar: '+r.error.message,'danger');
    if(btn){btn.disabled=false;btn.innerHTML='Enviar';}
    return;
  }
  if(inp)inp.value='';
  if(btn){btn.disabled=false;btn.innerHTML='Enviar';}

  // Recarregar mensagens e re-renderizar aba
  await carregarMsgsCaso();
  CT='compartilhar';
  renderMCir();
}

// ── Gerar novo link ─────────────────────────────────────────
async function gerarLink(){
  var nome=(document.getElementById('lk-nome')||{}).value||'';
  var email=(document.getElementById('lk-email')||{}).value||'';
  var tipo=(document.getElementById('lk-tipo')||{}).value||'hospital';
  var dias=parseInt((document.getElementById('lk-dias')||{}).value||'7');
  var pAprovar=!!(document.getElementById('lk-p-aprovar')||{}).checked;
  var pAnexar=!!(document.getElementById('lk-p-anexar')||{}).checked;
  var pMsg=document.getElementById('lk-p-msg');
  var permMsg=pMsg?pMsg.checked:true;

  if(!nome.trim()||!email.trim()){
    showAlert('Preencha nome e e-mail do destinatário.','warn');return;
  }
  if(!CF.id){
    showAlert('Grave a cirurgia primeiro antes de compartilhar.','warn');return;
  }

  var btn=document.getElementById('btn-gerar-link');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Gerando...';}

  var expira=new Date();
  expira.setDate(expira.getDate()+dias);

  var r=await DB.ins('caso_links',{
    caso_id:CF.caso_id,
    cirurgia_id:CF.id,
    destinatario_nome:nome.trim(),
    destinatario_email:email.trim(),
    destinatario_tipo:tipo,
    perm_visualizar:true,
    perm_aprovar:pAprovar,
    perm_anexar:pAnexar,
    perm_mensagem:permMsg,
    expira_em:expira.toISOString(),
    criado_por:(S.user&&S.user.id)||null,
    criado_por_nome:(S.user&&S.user.nome)||''
  });

  if(r.error){
    showAlert('Erro ao gerar link: '+r.error.message,'danger');
    if(btn){btn.disabled=false;btn.innerHTML='&#128279; Gerar e Copiar Link';}
    return;
  }

  // Copiar link para clipboard
  var token=r.data&&r.data[0]&&r.data[0].token;
  if(token){
    var url=window.location.origin+window.location.pathname+'?caso='+token;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        showAlert('Link copiado para a área de transferência!','success');
      });
    } else {
      showAlert('Link gerado! Copie manualmente: '+url,'success');
    }
  }

  // Recarregar links e re-renderizar aba
  await carregarLinksCaso();
  CT='compartilhar';
  renderMCir();
}

// ── Revogar link ────────────────────────────────────────────
async function enviarLinkPorEmail(url,email,nome){
  if(!confirm('Enviar link de acesso para '+email+'?'))return;
  try{
    var assunto=encodeURIComponent('Acesso ao Caso '+CF.caso_id+' - Virtus');
    var linha1='Ola '+nome+',';
    var linha2='Voce recebeu acesso ao caso '+CF.caso_id+' no sistema Virtus.';
    var linha3='Clique no link abaixo para visualizar:';
    var linha4=url;
    var linha5='Este link e valido por tempo limitado.';
    var linha6='Atenciosamente, '+((S.user&&S.user.nome)||'Equipe Virtus');
    var corpo=encodeURIComponent([linha1,'',linha2,'',linha3,linha4,'',linha5,'',linha6].join('\n'));
    window.open('mailto:'+email+'?subject='+assunto+'&body='+corpo,'_blank');
    showAlert('Cliente de e-mail aberto com o link pronto para enviar!','success');
  }catch(e){
    showAlert('Erro: '+e.message,'danger');
  }
}

async function revogarLink(id){
  if(!confirm('Revogar este link? O destinatário não conseguirá mais acessar.'))return;
  var r=await DB.upd('caso_links',{id:id,ativo:false},{id:id});
  if(r.error){showAlert('Erro: '+r.error.message,'danger');return;}
  await carregarLinksCaso();
  CT='compartilhar';
  renderMCir();
  showAlert('Link revogado!','success');
}

function renderCirs(){
  // Filtros ativos
  var q=(S.searchCir||'').toLowerCase().trim();
  var filt=S.cirs.filter(function(x){
    if(x.arquivada)return false;
    if(S.stCir!=='todos'&&x.status!==S.stCir)return false;
    // Filtro 'Minhas Cirurgias'
    if(S.filtMinhas&&S.user&&x.responsavel_id!==(S.user.db_id||S.user.id))return false;
    if(S.filtHosp&&x.hospital_id!==S.filtHosp)return false;
    if(S.filtOper&&x.operadora_id!==S.filtOper)return false;
    if(S.filtOrigem&&x.origem!==S.filtOrigem)return false;
    if(!q)return true;
    var h=S.devs.find(function(d){return d.id===x.hospital_id;});
    var op=S.devs.find(function(d){return d.id===x.operadora_id;});
    return (x.paciente||'').toLowerCase().includes(q)
      ||(x.medico||'').toLowerCase().includes(q)
      ||(h?h.razao_social:'').toLowerCase().includes(q)
      ||(op?op.razao_social:'').toLowerCase().includes(q)
      ||(x.data_cirurgia||'').includes(q)
      ||(x.origem||'').toLowerCase().includes(q)
      ||(x.caso_id||'').toLowerCase().includes(q)
      ||(x.id_cotacao_portal||'').toLowerCase().includes(q)
      ||STATUS[x.status].toLowerCase().includes(q);
  });

  var rows=filt.map(function(cc){
    var h=S.devs.find(function(d){return d.id===cc.hospital_id;});
    var op=S.devs.find(function(d){return d.id===cc.operadora_id;});
    var resp=S.usuarios.find(function(u){return u.id===cc.responsavel_id;});
    var opts=Object.entries(STATUS).map(function(e){
      return '<option value="'+e[0]+'"'+(cc.status===e[0]?' selected':'')+'>'+e[1]+'</option>';
    }).join('');
    var idCot=esc(cc.id_cotacao_portal||'--');
    return '<tr>'
      +'<td style="font-family:monospace;font-size:11px;font-weight:700;color:var(--tl)">'+esc(cc.caso_id||'--')+'</td>'
      +'<td style="font-weight:600">'+esc(cc.paciente||'--')+'</td>'
      +'<td>'+esc(cc.medico||'--')+'</td>'
      +'<td>'+esc(h?h.razao_social:'--')+'</td>'
      +'<td>'+esc(op?op.razao_social:'--')+'</td>'
      +'<td style="white-space:nowrap">'+fmtD(cc.data_cirurgia)+'</td>'
      +'<td><span class="tag">'+esc(cc.origem||'')+'</span></td>'
      +'<td style="font-size:11px;font-family:monospace;color:var(--tx2)">'+idCot+'</td>'
      +'<td>'+(resp?'<span class="badge bpr" style="font-size:10px">'+esc(resp.nome)+'</span>':'<span style="color:var(--tx3)">--</span>')+'</td>'
      +'<td style="font-weight:700;color:var(--tl)">'+fmt$(matTot(cc.mat_utilizado))+'</td>'
      +'<td><select style="border:1px solid var(--bd);background:transparent;font-size:11px;font-weight:600;cursor:pointer;border-radius:var(--r);padding:3px 5px" data-id="'+cc.id+'" class="st-sel">'+opts+'</select></td>'
      +'<td><div class="td-act">'
      +'<button class="btn btn-xs btn-p cir-dos-btn" data-id="'+cc.id+'">Dossie</button>'
      +'<button class="btn btn-xs btn-s cir-edit-btn" data-id="'+cc.id+'">Acessar</button>'
      +(canDo('arquivar_cir')?'<button class="btn btn-xs cir-arq-btn" style="background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)" title="Arquivar cirurgia" data-id="'+cc.id+'">&#128196;</button>':'')
      +'</div></td></tr>';
  }).join('');

  var ST_CANONICOS=['Aguardando Autorizacao de Faturamento','Faturamento Autorizado','Totalmente Faturado','Pendencia de Pagamento','Processo Concluido','Cobranca Recusada','Pedido de Esclarecimento'];
  var stOpts='<option value="todos">Todos os Status</option>'
    +ST_CANONICOS.map(function(v){
      return '<option value="'+v+'"'+(S.stCir===v?' selected':'')+'>'+v+'</option>';
    }).join('');

  var hospOpts='<option value="">Todos os Hospitais</option>'
    +S.devs.filter(function(d){return d.tipo==='Hospital';}).map(function(d){
      return '<option value="'+d.id+'"'+(S.filtHosp===d.id?' selected':'')+'>'+esc(d.razao_social)+'</option>';
    }).join('');
  var operOpts='<option value="">Todas as Operadoras</option>'
    +S.devs.filter(function(d){return d.tipo==='Operadora';}).map(function(d){
      return '<option value="'+d.id+'"'+(S.filtOper===d.id?' selected':'')+'>'+esc(d.razao_social)+'</option>';
    }).join('');
  var origOpts='<option value="">Todas as Origens</option>'
    +['Opmenexo','Inpart','EMS Ventura','GT Plan','Apoio','E-mail','Outros'].map(function(o){
      return '<option value="'+o+'"'+(S.filtOrigem===o?' selected':'')+'>'+o+'</option>';
    }).join('');

  var ativos=filt.length;
  var total=S.cirs.filter(function(x){return !x.arquivada;}).length;

  setHTML('pg',
    '<div class="pg-hd"><div><div class="pg-title">Cirurgias</div>'
    +'<div class="pg-sub">'+total+' registros | '+ativos+' exibidos</div></div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn btn-s" id="btn-export-xls" title="Exportar para Excel">&#128202; Excel</button>'
    +(canDo('criar_cir')?'<button class="btn btn-p" id="btn-nova-cir">+ Nova Cirurgia</button>':'')
    +'</div></div>'
    // Barra de filtros
    +'<div class="card" style="margin-bottom:12px;padding:12px 16px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+'<button class="btn '+(S.filtMinhas?'btn-p':'btn-s')+'" id="btn-minhas-cir">&#128100; Minhas</button>'+'</div>'+'<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center">'
    +'<div class="sw"><span class="sw-ic">?</span>'
    +'<input type="text" id="cir-search-inp" placeholder="Buscar paciente, medico, hospital, operadora, ID cotacao..." value="'+esc(S.searchCir||'')+'"/></div>'
    +'<select id="cir-st-sel">'+stOpts+'</select>'
    +'<select id="cir-hosp-sel">'+hospOpts+'</select>'
    +'<select id="cir-oper-sel">'+operOpts+'</select>'
    +'<select id="cir-orig-sel">'+origOpts+'</select>'
    +'</div></div>'
    +'<div class="card">'
    +(filt.length===0
      ?'<div class="empty"><h3>Nenhuma cirurgia encontrada</h3><p>Ajuste os filtros ou clique em + Nova Cirurgia.</p></div>'
      :'<div class="tbl-wrap"><table><thead><tr>'
      +'<th>Caso</th><th>Paciente</th><th>Medico</th><th>Hospital</th><th>Operadora</th>'
      +'<th>Data</th><th>Origem</th><th>ID Cotacao</th><th>Atribuida a</th><th>Vl.Utilizado</th>'
      +'<th>Status</th><th>Acoes</th>'
      +'</tr></thead><tbody>'+rows+'</tbody></table></div>')
    +'</div>'
  );

  // Binds via JS puro — sem onclick inline
  setTimeout(function(){
    // Busca: não re-renderiza a cada tecla (evita perda de foco)
    var inp=document.getElementById('cir-search-inp');
    if(inp){
      inp.oninput=function(){S.searchCir=this.value;renderCirs();};
      // Manter foco e cursor após re-render
      inp.focus();
      var v=inp.value; inp.value=''; inp.value=v;
    }
    var stSel=document.getElementById('cir-st-sel');
    if(stSel)stSel.onchange=function(){S.stCir=this.value;renderCirs();};
    var hSel=document.getElementById('cir-hosp-sel');
    if(hSel)hSel.onchange=function(){S.filtHosp=this.value;renderCirs();};
    var oSel=document.getElementById('cir-oper-sel');
    if(oSel)oSel.onchange=function(){S.filtOper=this.value;renderCirs();};

var CF=null,CT='geral';
function openMCir(c){
  CF=c?JSON.parse(JSON.stringify(c)):emptyCir();
  // mat_orcado sempre garante ao menos 1 linha vazia
  CF.mat_orcado=(CF.mat_orcado||[emptyMat()]).map(function(m){return Object.assign({_id:uid()},m);});
  // Demais abas: preservar se já têm dados, senão deixar VAZIO (sem copiar do orçado)
  ['mat_autorizado','mat_utilizado','mat_faturado'].forEach(function(k){
    var existing=CF[k]||[];
    var temDados=existing.length>0&&existing.some(function(m){return m.ref||m.desc;});
    CF[k]=temDados
      ? existing.map(function(m){return Object.assign({_id:uid()},m);})
      : []; // vazio por padrão
  });
  CF.atividades=pJ(CF.atividades).map(function(a){return Object.assign({_id:uid(),anexos:[]},a,{anexos:pJ(a.anexos)});});
  // Normalizar resp_* para array de histórico
  ['orcado','autorizado','utilizado','faturado'].forEach(function(k){
    var rk='resp_'+k;
    var v=CF[rk];
    if(!v) CF[rk]=[];
    else if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){v=[];} CF[rk]=Array.isArray(v)?v:(v.sol?[v]:[]);}
    else if(!Array.isArray(v)) CF[rk]=v.sol?[v]:[];
    // garantir que cada item tem ts
    CF[rk]=CF[rk].map(function(r){return Object.assign({ts:r.ts||new Date().toISOString()},r);});
  });
  CT='geral';renderMCir();
}

// Mapa: destino → fonte da etapa anterior
var _FASE_ANTERIOR={
  mat_autorizado:'mat_orcado',
  mat_utilizado:'mat_autorizado',
  mat_fat_autorizado:'mat_utilizado',
  mat_faturado:'mat_fat_autorizado'
};
var _FASE_LABEL={
  mat_orcado:'F1 Orcado',
  mat_autorizado:'F2 Autorizado',
  mat_utilizado:'F3 Utilizado',
  mat_fat_autorizado:'F4 Fat.Autorizado'
};

function importarEtapaAnterior(destKey){
  var srcKey=_FASE_ANTERIOR[destKey];
  if(!srcKey)return;
  var src=CF[srcKey]||[];
  var srcLabel=_FASE_LABEL[srcKey]||srcKey;
  if(!src.length||(src.length===1&&!src[0].ref&&!src[0].desc)){
    showAlert('Etapa anterior ('+srcLabel+') não tem itens para importar.','warn');
    return;
  }
  var dest=CF[destKey]||[];
  var vazio=!dest.length||(dest.length===1&&!dest[0].ref&&!dest[0].desc);
  if(!vazio&&!confirm('Esta etapa já tem itens. Substituir pelos itens da etapa anterior ('+srcLabel+')?'))return;
  CF[destKey]=src.map(function(m){return Object.assign({},m,{_id:uid()});});
  renderMCir();
  showAlert('Itens importados de '+srcLabel+'!','success');
}

// Manter compatibilidade com chamadas antigas
function copiarDeOrcado(destKey){importarEtapaAnterior(destKey);}

function addSolicitante(rk){
  var solEl=document.getElementById('rsp-sol-'+rk);
  if(!solEl||!solEl.value.trim()){
    showAlert('Informe ao menos o Nome do solicitante.','danger');return;
  }
  var entry={
    sol:document.getElementById('rsp-sol-'+rk).value.trim(),
    tel:(document.getElementById('rsp-tel-'+rk)||{}).value||'',
    email:(document.getElementById('rsp-email-'+rk)||{}).value||'',
    data:(document.getElementById('rsp-data-'+rk)||{}).value||'',
    ts:new Date().toISOString()
  };
  if(!Array.isArray(CF[rk]))CF[rk]=[];
  CF[rk].push(entry);
  renderMCir(); // rerender para mostrar no histórico
  showAlert('Solicitante registrado!','success');
}

function autoFillProd(k,i){
  var refEl=document.getElementById('m-ref-'+k+'-'+i);
  if(!refEl)return;
  var ref=refEl.value.trim().toUpperCase();
  var prod=S.prods.find(function(p){return (p.referencia||'').toUpperCase()===ref;});
  if(prod){
    CF[k][i].ref=prod.referencia;
    CF[k][i].desc=prod.descricao;
    if(prod.preco_lista&&!CF[k][i].vUnit){
      CF[k][i].vUnit=prod.preco_lista;
      CF[k][i].vTotal=(parseFloat(CF[k][i].qty||1)*parseFloat(prod.preco_lista||0)).toFixed(2);
    }
    renderMCir();
  }
}


function updM(k,i,f,v){
  CF[k][i][f]=v;
  if(f==='qty'||f==='vUnit'){
    CF[k][i].vTotal=(parseFloat(CF[k][i].qty||0)*parseFloat(CF[k][i].vUnit||0)).toFixed(2);
    // Atualiza só o campo total sem re-render
    var totalEl=document.getElementById('mat-tot-'+k+'-'+i);
    if(totalEl)totalEl.value=fmt$(CF[k][i].vTotal||0);
    // Atualiza o total geral
    var sumEl=document.getElementById('mat-sum-'+k);
    if(sumEl)sumEl.textContent='Total: '+fmt$(matTot(CF[k]));
  }
}
function addM(k){CF[k].push(emptyMat());renderMCir();}
function rmM(k,i){CF[k].splice(i,1);if(!CF[k].length)CF[k].push(emptyMat());renderMCir();}

function buildEvid(){

  function evCard(ev,i,fase){

      +'<div style="flex:1;min-width:0">'

      +'<div style="font-size:11px;color:var(--tx3);margin-top:3px">Por: '+esc(decisao.aprovado_por)+' — '+new Date(decisao.aprovado_em||decisao.decisao_em||Date.now()).toLocaleString('pt-BR')+'</div>'

    +secao('&#128196;&nbsp; Evidências Pré-Cirúrgicas ('+((CF.evidencias_pre||[]).length)+')','var(--sf2)',

    +secao('&#128196;&nbsp; Evidências Pós-Cirúrgicas ('+((CF.evidencias_pos||[]).length)+')','#f0faf5',
        addPosHtml+(posL||nenhum))

function hdEv(fase,input){

function buildSaldo(){
  var util=CF.mat_utilizado||[];
  var fat=CF.mat_faturado||[];
  var fatAut=CF.mat_fat_autorizado||[];

  // Calcular saldo por item: quantidade E valor
  var saldoItens=util.filter(function(m){return m.ref||m.desc;}).map(function(m){
    var fatItems=fat.filter(function(f){return f.ref===m.ref;});
    var qtdFat=fatItems.reduce(function(s,f){return s+parseFloat(f.qty||0);},0);
    var vlFat=fatItems.reduce(function(s,f){return s+parseFloat(f.vTotal||0);},0);
    var qtdUtil=parseFloat(m.qty||0);
    var vlUtil=parseFloat(m.vTotal||0);
    var saldoQtd=qtdUtil-qtdFat;
    var saldoVl=vlUtil-vlFat;
    var vlUnitario=parseFloat(m.vUnit||0);
    return Object.assign({},m,{
      qtdFat:qtdFat, vlFat:vlFat,
      saldoQtd:saldoQtd, saldoVl:saldoVl,
      vlUnitario:vlUnitario
    });
  }).filter(function(m){return m.saldoQtd>0.001||m.saldoVl>0.01;});

  // Itens F4 ainda não faturados
  var pendFat=fatAut.filter(function(m){return m.ref||m.desc;}).map(function(m){
    var fatItems=fat.filter(function(f){return f.ref===m.ref;});
    var qtdFat=fatItems.reduce(function(s,f){return s+parseFloat(f.qty||0);},0);
    var vlFat=fatItems.reduce(function(s,f){return s+parseFloat(f.vTotal||0);},0);
    var qtdPend=parseFloat(m.qty||0)-qtdFat;
    var vlPend=parseFloat(m.vTotal||0)-vlFat;
    return Object.assign({},m,{qtdPend:qtdPend,vlPend:vlPend});
  }).filter(function(m){return m.qtdPend>0.001||m.vlPend>0.01;});

  var totalSaldoVl=saldoItens.reduce(function(s,m){return s+m.saldoVl;},0);
  var totalSaldoQtd=saldoItens.reduce(function(s,m){return s+m.saldoQtd;},0);
  var totalPendVl=pendFat.reduce(function(s,m){return s+m.vlPend;},0);

  var rows=saldoItens.map(function(m){
    return '<tr>'
      +'<td style="font-family:monospace;font-size:11px">'+esc(m.ref||'--')+'</td>'
      +'<td>'+esc(m.desc||'--')+'</td>'
      +'<td style="text-align:center;color:var(--tx2)">'+parseFloat(m.qty||0)+'</td>'
      +'<td style="text-align:center;color:var(--gn)">'+m.qtdFat+'</td>'

async function saveCir(){
  if(!CF.paciente){var e=document.getElementById('cerr');if(e)e.innerHTML='<div class="alert al-d">Nome do paciente obrigatorio.</div>';return;}

  // ── Verificação de Processo Concluido com saldo pendente ──
  if(CF.status==='Processo Concluido'){
    var util=matTot(CF.mat_utilizado||[]);
    var fat=matTot(CF.mat_faturado||[]);
    var saldoPend=Math.max(0,util-fat);
    if(saldoPend>0.01){
      var msg='Há saldo pendente de faturamento de '+fmt$(saldoPend)+'.\n\n'
        +'Ao prosseguir você declara que foram encerradas as tratativas para esta cirurgia. '
        +'Os itens pendentes de faturamento deixarão de constar nos relatórios de cobrança '
        +'para a fonte pagadora até que o status seja modificado para pendente de faturamento novamente.\n\n'
        +'Deseja prosseguir?';
      if(!confirm(msg))return;
      // Registrar encerramento com pendência
      if(!Array.isArray(CF.historico_encerramento))CF.historico_encerramento=[];
      CF.historico_encerramento.push({
        tipo:'com_pendencia',
        descricao:'Processo concluido com saldo a faturar',
        saldo:saldoPend,
        usuario:(S.user&&S.user.email)||'--',
        ts:new Date().toISOString()
      });
    } else {
      // Registrar encerramento sem pendência
      if(!Array.isArray(CF.historico_encerramento))CF.historico_encerramento=[];
      CF.historico_encerramento.push({
        tipo:'sem_pendencia',
        descricao:'Processo concluido sem pendencias de faturamento',
        saldo:0,
        usuario:(S.user&&S.user.email)||'--',
        ts:new Date().toISOString()
      });
    }
  }

  var btn=document.getElementById('bsc');btn.innerHTML='<span class="spin"></span> Gravando...';btn.disabled=true;
  try{
    // Não sobrescrever resp_* — é histórico, já foi gerenciado por addSolicitante()
    // Apenas garantir que existem como arrays
    ['orcado','autorizado','utilizado','faturado'].forEach(function(k){
      var rk='resp_'+k;
      if(!Array.isArray(CF[rk]))CF[rk]=CF[rk]&&CF[rk].sol?[CF[rk]]:[];
    });
    // Capturar campos de material ainda em foco
    ['mat_orcado','mat_autorizado','mat_utilizado','mat_faturado'].forEach(function(k){
      (CF[k]||[]).forEach(function(m,i){
        var ref=document.getElementById('m-ref-'+k+'-'+i);
        var desc=document.getElementById('m-desc-'+k+'-'+i);
        if(ref)m.ref=ref.value;
        if(desc)m.desc=desc.value;
      });
    });
    // Montar payload
    var payload=Object.assign({},CF);
    // Gerar caso_id automático para cirurgias novas
    if(!payload.caso_id){
      var ano=new Date().getFullYear();
      var seq=String(S.cirs.filter(function(x){return !x.arquivada;}).length+1).padStart(4,'0');
      payload.caso_id='VRT-'+ano+'-'+seq;
      CF.caso_id=payload.caso_id;
    }
    // Salvar responsaveis na coluna dedicada (se existir no banco)
    payload.responsaveis={
      orcado:CF.resp_orcado||[],
      autorizado:CF.resp_autorizado||[],
      utilizado:CF.resp_utilizado||[],
      fat_autorizado:CF.resp_fat_autorizado||[],
      faturado:CF.resp_faturado||[]
    };
    payload.mat_fat_autorizado=CF.mat_fat_autorizado||[];
    // TAMBÉM embutir responsaveis dentro de mat_orcado como elemento _meta
    // Isso garante persistência mesmo se a coluna responsaveis não existir
    var metaElem={_meta:true,_responsaveis:{
      orcado:CF.resp_orcado||[],
      autorizado:CF.resp_autorizado||[],
      utilizado:CF.resp_utilizado||[],
      fat_autorizado:CF.resp_fat_autorizado||[],
      faturado:CF.resp_faturado||[]
    }};
    var matOrc=payload.mat_orcado.filter(function(m){return !m._meta;});
    payload.mat_orcado=[metaElem].concat(matOrc);
    // Remover campos resp_* soltos
    delete payload.resp_orcado;
    delete payload.resp_autorizado;
    delete payload.resp_utilizado;
    delete payload.resp_fat_autorizado;
    delete payload.resp_faturado;
    // Remover campos internos em memória (não existem no banco)
    delete payload._aprovacoes;
    delete payload._links;
    delete payload._msgs;
    delete payload._msgsBadge;
    delete payload._anexosDev;
    // historico_encerramento é persistido no banco (coluna jsonb)
    var res;
    if(payload.id){res=await DB.upd('cirurgias',payload,{id:payload.id});}
    else{var{id,...ins}=payload;res=await DB.ins('cirurgias',ins);}
    if(res.error)throw new Error(res.error.message||JSON.stringify(res.error));
    // Atualizar id se era cirurgia nova
    if(!CF.id&&res.data){
      var saved=Array.isArray(res.data)?res.data[0]:res.data;
      if(saved&&saved.id)CF.id=saved.id;
    }
    // Recarregar lista em background SEM fechar o modal
    loadData().then(function(){
      // Atualizar contador de cirurgias no título da topbar (opcional)
      if(S.page==='cirurgias'){
        var sub=document.querySelector('.tb-sub');
        if(sub)sub.textContent='Virtus / Cirurgias';
      }
    });
    // Modal permanece aberto — atualizar título
    var titleEl=document.querySelector('#mcir-wrap .modal-title');
    if(titleEl)titleEl.textContent='Editar Cirurgia -- '+(CF.paciente||'');
    btn.innerHTML='Gravar Cirurgia';btn.disabled=false;
    showAlert('Cirurgia gravada com sucesso! ✓','success');
  }catch(e){
    var el=document.getElementById('cerr');
    if(el)el.innerHTML='<div class="alert al-d">Erro: '+esc(e.message)+'</div>';
    btn.innerHTML='Gravar Cirurgia';btn.disabled=false;
  }
}

async function arquivarCir(id){
  if(!confirm('Arquivar esta cirurgia? Ela será removida da lista de pendências mas mantida para consulta futura.'))return;
  var cir=S.cirs.find(function(x){return x.id===id;});
  if(!cir)return;
  var r=await DB.upd('cirurgias',{id:id,arquivada:true},{id:id});
  if(r.error){showAlert('Erro ao arquivar: '+r.error.message,'danger');return;}
  cir.arquivada=true;
  renderCirs();
  showAlert('Cirurgia arquivada com sucesso!','success');
}

/* ── AGENDA ──────────────────────────────────────────────── */
function renderAgenda(){
  var hoje=new Date().toISOString().split('T')[0];
  var acoes=[];
  var concluidas=[];
  var isAdmin=(S.user&&S.user.perfil==='admin');
  var myDbId=(S.user&&S.user.db_id)||'';

  // Admin vê todas; outros veem apenas atividades de suas cirurgias
  var cirsVisiveis=S.cirs.filter(function(cc){
    if(cc.arquivada)return false;
    if(isAdmin){
      // Admin pode filtrar só as suas
      if(S.agFiltMinhas&&myDbId)return cc.responsavel_id===myDbId;
      return true;
    }
    return cc.responsavel_id===myDbId;
  });

  cirsVisiveis.forEach(function(cc){
    (cc.atividades||[]).forEach(function(a){
      var h=S.devs.find(d=>d.id===cc.hospital_id);
      var base=Object.assign({},a,{paciente:cc.paciente,hospital:h?h.razao_social:'--',cid:cc.id});
      if(a.concluido){concluidas.push(base);}
      else if(a.data_proximo&&a.proximo_passo){acoes.push(Object.assign({},base,{venc:a.data_proximo<hoje}));}
    });
  });
  acoes.sort((a,b)=>a.data_proximo.localeCompare(b.data_proximo));
  concluidas.sort((a,b)=>(b.data_conclusao||'').localeCompare(a.data_conclusao||''));
  var prox=acoes.filter(a=>!a.venc);
  var venc=acoes.filter(a=>a.venc);

  // ── Painel de stats ──
  var porTipo={};
  var tempoTipo={};
  concluidas.forEach(function(a){
    var t=a.tipo||'Outros';
    porTipo[t]=(porTipo[t]||0)+1;
    var dur=parseFloat(a.duracao||0);
    tempoTipo[t]=(tempoTipo[t]||0)+dur;
  });
  var rankQtd=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
  var rankTempo=Object.entries(tempoTipo).sort((a,b)=>b[1]-a[1]);

  // Rosca de ações por tipo
  var donutAtvData=rankQtd.map(([k,v])=>({lbl:k,v}));
  var donutAtvHtml=buildDonut(donutAtvData,'Acoes',v=>v+' acoes');

  // Ranking de quantidade

function hdConcAnx(input){
  Array.from(input.files).forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(e){
      window._concAnexos=window._concAnexos||[];
      window._concAnexos.push({nome:f.name,data:e.target.result});
      var lst=document.getElementById('mc-anx-list');
      if(lst){
        lst.innerHTML=window._concAnexos.map(function(a){
          return '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:#F4F6F9;border:1px solid #DDE2EA;border-radius:20px;font-size:11px">&#128206; '+esc(a.nome)+'</span>';
        }).join('');
      }
    };
    rd.readAsDataURL(f);
  });
}


async function salvarConclusao(cid,atvId){
  var reg=document.getElementById('mc-reg')?document.getElementById('mc-reg').value.trim():'';
  if(!reg){
    alert('Preencha o campo Registro / Observacoes.');
    return;
  }
  var cir=S.cirs.find(function(x){return x.id===cid;});
  if(!cir)return;
  var atv=cir.atividades.find(function(a){return a._id===atvId;});
  if(!atv)return;
  var btn=document.getElementById('mc-ok');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  var dataVal=document.getElementById('mc-data')?document.getElementById('mc-data').value:'';
  var statusVal=document.getElementById('mc-status')?document.getElementById('mc-status').value:'concluida';
  // Atualizar a atividade (nunca excluir — só marcar como concluída)
  atv.concluido=true;
  atv.status_conclusao=statusVal;
  atv.data_conclusao=toISO(dataVal)||new Date().toISOString().split('T')[0];
  atv.hora_conclusao=document.getElementById('mc-hora')?document.getElementById('mc-hora').value:'';
  atv.duracao_real=document.getElementById('mc-dur')?document.getElementById('mc-dur').value:'';
  atv.contato_conclusao=document.getElementById('mc-cont')?document.getElementById('mc-cont').value:'';
  atv.tel_conclusao=document.getElementById('mc-tel')?document.getElementById('mc-tel').value:'';
  atv.obs_conclusao=reg;
  atv.anexos_conclusao=window._concAnexos||[];
  var r=await DB.upd('cirurgias',{id:cid,atividades:cir.atividades},{id:cid});
  if(r.error){
    alert('Erro ao salvar: '+r.error.message);
    if(btn){btn.disabled=false;btn.textContent='✓ Confirmar Conclusao';}
    return;
  }
  var modal=document.getElementById('modal-concluir');
  if(modal)modal.remove();
  window._concAnexos=[];
  showAlert('Acao registrada com sucesso!','success');
  await loadData();
  renderAgenda();
}

async function saveProd(){
  if(!PF.referencia||!PF.descricao){
    var e=document.getElementById('perr');
    if(e)e.innerHTML='<div class="alert al-d">Referencia e Descricao sao obrigatorios.</div>';
    return;
  }
  var btn=document.getElementById('bsprod');btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  try{
    var res;
    if(PF.id){res=await DB.upd('produtos',PF,{id:PF.id});}
    else{var{id,...ins}=PF;res=await DB.ins('produtos',ins);}
    if(res.error)throw new Error(res.error.message);

// Carregar protocolo nos itens de uma aba
function carregarProtocolo(protoId,destKey){
  var pt=S.protos.find(function(p){return p.id===protoId;});
  if(!pt)return;
  var dest=CF[destKey]||[];
  var vazio=!dest.length||(dest.length===1&&!dest[0].ref&&!dest[0].desc);
  if(!vazio&&!confirm('A aba ja tem itens. Deseja substituir pelos itens do protocolo?'))return;
  CF[destKey]=(pt.itens||[]).map(function(m){return Object.assign({},m,{_id:uid(),vTotal:(parseFloat(m.qty||1)*parseFloat(m.vUnit||0)).toFixed(2)});});
  renderMCir();
  showAlert('Protocolo carregado!','success');
}

function autoFillProtoItem(i){
  var refEl=document.getElementById('pt-ref-'+i);
  if(!refEl)return;
  var ref=(refEl.value||'').trim().toUpperCase();
  var prod=S.prods.find(function(p){return (p.referencia||'').toUpperCase()===ref;});
  if(prod){
    PTF.itens[i].ref=prod.referencia;
    PTF.itens[i].desc=prod.descricao;
    if(prod.preco_lista)PTF.itens[i].vUnit=prod.preco_lista;
    renderMProto();
  }
}

  var w=document.getElementById('mproto-float');if(w)w.remove();

async function saveProto(){
  if(!PTF.nome){
    var e=document.getElementById('pterr');
    if(e)e.innerHTML='<div class="alert al-d">Nome do protocolo obrigatorio.</div>';
    return;
  }
  var btn=document.getElementById('bsproto');btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  try{
    var payload={nome:PTF.nome,especialidade:PTF.especialidade,procedimento:PTF.procedimento,itens:PTF.itens.filter(function(m){return m.ref||m.desc;})};
    var res;
    if(PTF.id){res=await DB.upd('protocolos',Object.assign({id:PTF.id},payload),{id:PTF.id});}
    else{res=await DB.ins('protocolos',payload);}
    if(res.error)throw new Error(res.error.message);
    // Salvar novo protocolo na lista local imediatamente
    var savedProto=res.data;
    if(savedProto){
      if(PTF.id){S.protos=S.protos.map(function(p){return p.id===PTF.id?Object.assign({},p,payload,{id:PTF.id}):p;});}
      else{S.protos.push(Object.assign({},payload,{id:savedProto.id||savedProto[0]&&savedProto[0].id}));}
    }
    // Recarregar lista completa em background sem bloquear UI
    DB.sel('protocolos',{select:'*',order:'nome'}).then(function(r){
      if(r.data)S.protos=r.data.map(function(p){return Object.assign({},p,{itens:pJ(p.itens)});});
    });
    // Fechar apenas o modal de protocolo
    closeMProto();
    // Se o modal de cirurgia está aberto, apenas atualizar o select de protocolos
    var cirModal=document.getElementById('mcir-wrap');
    if(cirModal&&cirModal.innerHTML&&CT==='orcado'){
      // Remontar apenas o select sem re-render completo
      var protoOpts2=(S.protos||[]).map(function(pt){
        return '<option value="'+pt.id+'">'+esc(pt.nome)+(pt.especialidade?' ('+esc(pt.especialidade)+')':'')+'</option>';
      }).join('');
      var selEl=document.querySelector('#mcir-wrap select[onchange*="carregarProtocolo"]');
      if(selEl){
        selEl.innerHTML='<option value="">Carregar Protocolo...</option>'+protoOpts2;
      } else {
        // Recriar o bloco inteiro do select
        renderMCir();
      }
    } else if(!cirModal||!cirModal.innerHTML){
      // Estamos na página de protocolos — renderizar normalmente
      renderProtocolos();
    }
    showAlert('Protocolo salvo com sucesso!','success');
  }catch(e){
    var el=document.getElementById('pterr');
    if(el)el.innerHTML='<div class="alert al-d">Erro: '+esc(e.message)+'</div>';
    btn.innerHTML='Salvar Protocolo';btn.disabled=false;
  }
}

async function salvarConvite(){

  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Enviando...';}

  try{
    // Usar Edge Function "virtus-invite" que tem service_role key
    var r=await fetch(DB.url+'/functions/v1/virtus-invite',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+localStorage.getItem('vt_token')
      },
      body:JSON.stringify({
        email:email.trim(),
        nome:nome.trim(),
        perfil:perfil
      })
    });
    var d=await r.json();
    if(!r.ok||d.error){
      var msg=d.error||d.message||'Erro ao enviar convite.';
      if(errEl)errEl.innerHTML='<div class="alert al-d">'+esc(msg)+'</div>';
      if(btn){btn.disabled=false;btn.innerHTML='Enviar Convite';}
      return;
    }
    var modal=document.getElementById('modal-usr');
    if(modal)modal.remove();
    await loadData();
    renderUsuarios();
    showAlert('Convite enviado para '+email+'!','success');
  }catch(e){
    if(errEl)errEl.innerHTML='<div class="alert al-d">Erro: '+esc(e.message)+'</div>';
    if(btn){btn.disabled=false;btn.innerHTML='Enviar Convite';}
  }
}

async function reenviarConvite(id,email,nome){
  if(!confirm('Reenviar acesso para '+email+'?'))return;
  showAlert('Enviando...','info');
  try{
    // Passar redirect_to como query string — forma correta da API GoTrue
    var redirectTo=encodeURIComponent('https://virtuspendfat.github.io/virtus/virtus.html');
    var r=await fetch(DB.url+'/auth/v1/recover?redirect_to='+redirectTo,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':DB.key,
        'Authorization':'Bearer '+DB.key
      },
      body:JSON.stringify({email:email})
    });
    if(r.ok){
      showAlert('E-mail de acesso enviado para '+email+'!','success');
    } else {
      var d=await r.json();
      showAlert('Erro: '+(d.error_description||d.msg||'Falha ao enviar.'),'danger');
    }
  }catch(e){
    showAlert('Erro: '+e.message,'danger');
  }
}

async function salvarEdicaoUsuario(id){
  var nome=(document.getElementById('usr-nome')||{}).value||'';
  var perfil=(document.getElementById('usr-perfil')||{}).value||'operador';
  var errEl=document.getElementById('usr-modal-err');

  }
  var btn=document.getElementById('btn-salvar-usr');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Salvando...';}
  var r=await DB.upd('usuarios',{id:id,nome:nome.trim(),perfil:perfil},{id:id});

async function toggleUsuario(id,ativoAtual){
  var novoAtivo=!ativoAtual;
  var msg=novoAtivo?'Ativar este usuario?':'Desativar este usuario?';
  if(!confirm(msg))return;
  var r=await DB.upd('usuarios',{id:id,ativo:novoAtivo},{id:id});
  if(r.error){showAlert('Erro: '+r.error.message,'danger');return;}
  await loadData();
  renderUsuarios();
  showAlert(novoAtivo?'Usuario ativado!':'Usuario desativado!','success');
}

function relFiltrarCirs(){
  return S.cirs.filter(function(c){
    if(RF_FILTROS.hospital&&c.hospital_id!==RF_FILTROS.hospital)return false;
    if(RF_FILTROS.operadora&&c.operadora_id!==RF_FILTROS.operadora)return false;
    if(RF_FILTROS.origem&&c.origem!==RF_FILTROS.origem)return false;
    if(RF_FILTROS.status&&c.status!==RF_FILTROS.status)return false;
    if(RF_FILTROS.fonte_pagadora){
      var fp=(c.fonte_pagadora||'').toLowerCase();
      var filt=RF_FILTROS.fonte_pagadora.toLowerCase();
      if(!fp.includes(filt))return false;
    }
    return true;
  });
}

function groupBy(k){
  var m={};
  S.cirs.forEach(function(c){
    var lbl='';
    if(k==='hospital'){var h=S.devs.find(d=>d.id===c.hospital_id);lbl=h?h.razao_social:'Nao informado';}
    else if(k==='operadora'){var o=S.devs.find(d=>d.id===c.operadora_id);lbl=o?o.razao_social:'Nao informado';}
    else if(k==='portal')lbl=c.origem||'Nao informado';
    else lbl=c.medico||'Nao informado';
    if(!m[lbl])m[lbl]={cnt:0,a:0,u:0,p:0,r:0};
    m[lbl].cnt++;m[lbl].a+=matTot(c.mat_autorizado);m[lbl].u+=matTot(c.mat_utilizado);
    if(['Aguardando Autorizacao de Faturamento','Faturamento Autorizado','Pendencia de Pagamento'].includes(c.status))m[lbl].p++;
    if(c.status==='Processo Concluido')m[lbl].r++;
  });
  return Object.entries(m).sort((a,b)=>b[1].u-a[1].u);
}

function exportRelXLS(cirs){
  var header=['Caso','Paciente','Medico','Hospital','Operadora','Fonte Pagadora','ID Cotacao','Data Cirurgia','Status','Vl.Utilizado','Vl.Faturado','Vl.Pendente'];
  var lines=[header.join(';')];
  cirs.forEach(function(c){
    var h=S.devs.find(function(d){return d.id===c.hospital_id;})||{};
    var o=S.devs.find(function(d){return d.id===c.operadora_id;})||{};
    var util=matTot(c.mat_utilizado);
    var fat=matTot(c.mat_faturado);
    var pend=Math.max(0,util-fat);
    lines.push([c.caso_id||'',c.paciente||'',c.medico||'',h.razao_social||'',o.razao_social||'',
      c.fonte_pagadora||'',c.id_cotacao_portal||'',fmtD(c.data_cirurgia),c.status||'',
      util.toFixed(2).replace('.',','),fat.toFixed(2).replace('.',','),pend.toFixed(2).replace('.',',')
    ].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';'));
  });
  var blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='relatorio_cobrancas_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  URL.revokeObjectURL(url);
}

function parseLine(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){if(l[i]==='"'){if(q&&l[i+1]==='"'){c+='"';i++;}else q=!q;}else if(l[i]===','&&!q){r.push(c.trim());c='';}else c+=l[i];}r.push(c.trim());return r;}
async function parseCSV(file){return new Promise((res)=>{var rd=new FileReader();rd.onload=e=>{var lines=e.target.result.split(/\r?\n/).filter(l=>l.trim());var hdrs=parseLine(lines[0]).map(h=>h.toLowerCase().trim().replace(/[^a-z_]/g,''));var rows=lines.slice(1).map(l=>{var v=parseLine(l);var o={};hdrs.forEach((h,i)=>o[h]=v[i]||'');return o;});res(rows);};rd.readAsText(file,'UTF-8');});}

function exportCirsXLS(rows){
  var header=['Paciente','Medico','Hospital','Operadora','Data','Origem','ID Cotacao',
    'Vl.Orcado','Vl.Autorizado','Vl.Utilizado','Vl.Faturado','Status'];
  var lines=[header.join(';')];
  rows.forEach(function(cc){
    var h=S.devs.find(function(d){return d.id===cc.hospital_id;});
    var op=S.devs.find(function(d){return d.id===cc.operadora_id;});
    var row=[
      cc.paciente||'',cc.medico||'',
      h?h.razao_social:'',op?op.razao_social:'',
      fmtD(cc.data_cirurgia),cc.origem||'',
      cc.id_cotacao_portal||'',
      matTot(cc.mat_orcado).toFixed(2),
      matTot(cc.mat_autorizado).toFixed(2),
      matTot(cc.mat_utilizado).toFixed(2),
      matTot(cc.mat_faturado).toFixed(2),
      STATUS[cc.status]||cc.status
    ];
    lines.push(row.map(function(v){
      var s=String(v).replace(/"/g,'""');
      return s.includes(';')||s.includes('"')?'"'+s+'"':s;
    }).join(';'));
  });
  var bom='﻿'; // BOM para UTF-8 no Excel
    var blob=new Blob([bom+lines.join(String.fromCharCode(10))],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='cirurgias_virtus_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showAlert('Exportado com sucesso! Abra o arquivo no Excel.','success');
}

function dlHtml(){
  var blob=new Blob([document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='virtus.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
