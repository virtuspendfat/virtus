// PORTAL DO DEVEDOR — Acesso via link temporário
// ══════════════════════════════════════════════════════════

async function renderPortalDevedor(token){
  // Mostrar loading
  document.getElementById('app').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">'
    +'<div style="text-align:center;color:var(--tx3)">'
    +'<div style="font-family:Poppins,sans-serif;font-size:24px;font-weight:800;color:var(--tl);margin-bottom:8px">Virtus</div>'
    +'<div style="font-size:13px">Carregando...</div>'
    +'</div></div>';

  // Buscar link pelo token (anon — sem autenticação)
  var r=await DB.sel('caso_links',{
    select:'*',
    eq:{token:token,ativo:true},
    limit:1
  });

  if(!r.data||r.data.length===0){
    renderPortalErro('Link inválido ou expirado.',
      'Este link não existe ou foi revogado. Entre em contato com o cobrador.');
    return;
  }

  var lk=r.data[0];

  // Verificar expiração
  if(new Date(lk.expira_em)<new Date()){
    renderPortalErro('Link expirado.',
      'Este link expirou em '+new Date(lk.expira_em).toLocaleDateString('pt-BR')+
      '. Solicite um novo link ao cobrador.');
    return;
  }

  // Registrar acesso
  await DB.upd('caso_links',{
    id:lk.id,
    acessos:(lk.acessos||0)+1,
    ultimo_acesso:new Date().toISOString()
  },{id:lk.id});

  // Buscar dados da cirurgia
  var rc=await DB.sel('cirurgias',{select:'*',eq:{id:lk.cirurgia_id},limit:1});
  if(!rc.data||rc.data.length===0){
    renderPortalErro('Caso não encontrado.','O caso associado a este link não foi encontrado.');
    return;
  }
  var cir=rc.data[0];

  // Buscar hospital e operadora
  var devs=await DB.sel('devedores',{select:'*'});
  var devsArr=devs.data||[];
  var hosp=devsArr.find(function(d){return d.id===cir.hospital_id;});
  var oper=devsArr.find(function(d){return d.id===cir.operadora_id;});

  // Buscar aprovacoes existentes (anon)
  var ra=await dbAnonSel('caso_aprovacoes',{cirurgia_id:lk.cirurgia_id},'aprovado_em.desc');
  var aprovs=ra.data||[];

  // Buscar anexos do devedor
  var ran=await dbAnonSel('caso_anexos_devedor',{cirurgia_id:lk.cirurgia_id},'created_at.asc');
  var anexosDev=ran.data||[];

  // Renderizar portal
  renderPortalUI(lk,cir,hosp,oper,aprovs,anexosDev,token);
}

// Função auxiliar para inserção anônima (devedor via link)
async function dbAnonIns(tabela,dados){
  try{
    var r=await fetch(DB.url+'/rest/v1/'+tabela,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':DB.key,
        'Authorization':'Bearer '+DB.key,
        'Prefer':'return=representation'
      },
      body:JSON.stringify(dados)
    });
    var d=await r.json();
    if(!r.ok)return{error:{message:d.message||d.error||JSON.stringify(d)}};
    return{data:Array.isArray(d)?d:[d]};
  }catch(e){return{error:{message:e.message}};}
}

// Função auxiliar para update anônimo
async function dbAnonUpd(tabela,dados,filtro){
  try{
    var params=Object.entries(filtro).map(function(e){return e[0]+'=eq.'+encodeURIComponent(e[1]);}).join('&');
    var r=await fetch(DB.url+'/rest/v1/'+tabela+'?'+params,{
      method:'PATCH',
      headers:{
        'Content-Type':'application/json',
        'apikey':DB.key,
        'Authorization':'Bearer '+DB.key,
        'Prefer':'return=representation'
      },
      body:JSON.stringify(dados)
    });
    var d=await r.json();
    if(!r.ok)return{error:{message:d.message||d.error||JSON.stringify(d)}};
    return{data:Array.isArray(d)?d:[d]};
  }catch(e){return{error:{message:e.message}};}
}

// Helper para selecionar anônimo
async function dbAnonSel(tabela,filtros,ordem){
  try{
    var params='select=*&'+Object.entries(filtros).map(function(e){
      return e[0]+'=eq.'+encodeURIComponent(e[1]);
    }).join('&');
    // ordem opcional — só adicionar se a tabela tiver a coluna
    var orderStr=ordem?('&order='+ordem):'';
    var r=await fetch(DB.url+'/rest/v1/'+tabela+'?'+params+orderStr,{
      headers:{'apikey':DB.key,'Authorization':'Bearer '+DB.key}
    });
    var d=await r.json();
    if(!r.ok)return{data:[]};
    return{data:Array.isArray(d)?d:[]};
  }catch(e){return{data:[]};}
}

// ── Nova função principal de decisão do Devedor ──────────────
async function registrarDecisaoPortal(lk,cir,token){
  var radios=document.querySelectorAll('input[name="portal-decisao"]');
  var decisao='';
  radios.forEach(function(r){if(r.checked)decisao=r.value;});
  if(!decisao){showAlert('Selecione uma decisão antes de confirmar.','warn');return;}

  var btn=document.getElementById('btn-portal-confirmar');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Enviando...';}

  var recusaRazao='';
  var esclTipos=[];
  var esclOutros='';
  var ocNome='';
  var ocData=null;

  if(decisao==='Recusado'){
    recusaRazao=(document.getElementById('portal-recusa-razao')||{}).value||'';
    if(!recusaRazao.trim()){
      showAlert('Informe a razão da recusa.','warn');
      if(btn){btn.disabled=false;btn.innerHTML='Confirmar Decisao';}
      return;
    }
  }

  if(decisao==='Pedido de Esclarecimento'){
    document.querySelectorAll('.escl-tipo:checked').forEach(function(c){esclTipos.push(c.value);});
    if(!esclTipos.length){
      showAlert('Selecione ao menos um tipo de esclarecimento.','warn');
      if(btn){btn.disabled=false;btn.innerHTML='Confirmar Decisao';}
      return;
    }
    if(esclTipos.includes('Outros')){
      esclOutros=(document.getElementById('portal-outros-desc')||{}).value||'';
    }
  }

  if(decisao==='Aprovado'){
    var ocFile=document.getElementById('portal-oc-file');
    var file=ocFile&&ocFile.files&&ocFile.files[0];
    if(file){
      ocData=await new Promise(function(resolve){
        var rd=new FileReader();
        rd.onload=function(e){resolve(e.target.result);};
        rd.readAsDataURL(file);
      });
      ocNome=file.name;
    }
  }

  // Gravar em caso_aprovacoes
  // Serializar array como texto para compatibilidade com Supabase REST
  var esclTiposStr=esclTipos.length?esclTipos.join(' | '):null;

  var r=await dbAnonIns('caso_aprovacoes',{
    caso_id:cir.caso_id||('CIR-'+cir.id),
    cirurgia_id:lk.cirurgia_id,
    link_token:lk.token,
    tipo:decisao==='Aprovado'?'autorizar_faturamento':decisao==='Recusado'?'recusar_faturamento':'pedido_esclarecimento',
    observacao:decisao,
    aprovado_por:lk.destinatario_nome,
    decisao:decisao,
    decisao_em:new Date().toISOString(),
    recusa_razao:recusaRazao||null,
    esclarecimento_outros:esclOutros||null,
    doc_tipo:ocNome?'Ordem de Compra':null,
    doc_nome:ocNome||null,
    doc_data:null
  });

  if(r.error){
    console.error('Erro caso_aprovacoes:', JSON.stringify(r.error));
    showAlert('Erro ao registrar: '+r.error.message,'danger');
    if(btn){btn.disabled=false;btn.innerHTML='Confirmar Decisao';}
    return;
  }

  // Gravar OC em caso_anexos_devedor (separado para evitar payload grande)
  if(ocNome&&ocData){
    await dbAnonIns('caso_anexos_devedor',{
      caso_id:cir.caso_id,
      cirurgia_id:lk.cirurgia_id,
      link_token:lk.token,
      tipo:'Ordem de Compra',
      nome:ocNome,
      url:ocData
    });
  }

  // Atualizar status da cirurgia
  var novoStatus=decisao==='Aprovado'?'Faturamento Autorizado':decisao==='Recusado'?'Cobranca Recusada':'Pedido de Esclarecimento';
  await dbAnonUpd('cirurgias',{status:novoStatus},{id:cir.id});

  var msg=decisao==='Aprovado'?'Faturamento aprovado com sucesso!':decisao==='Recusado'?'Recusa registrada.':'Pedido de esclarecimento registrado.';
  showAlert(msg,'success');
  setTimeout(function(){renderPortalDevedor(token);},1500);
}

async function registrarAprovacaoComDoc(lk,cir,token,obs,tipoDoc){
  var btn=document.getElementById('btn-portal-confirmar');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Enviando...';}

  var fileInput=document.getElementById('portal-doc-file');
  var file=fileInput&&fileInput.files&&fileInput.files[0];

  // Converter arquivo para base64
  var docData=null;
  var docNome='';
  if(file){
    docData=await new Promise(function(resolve){
      var rd=new FileReader();
      rd.onload=function(e){resolve(e.target.result);};
      rd.readAsDataURL(file);
    });
    docNome=file.name;
  }

  var observacao=tipoDoc+(obs?': '+obs:'')+(docNome?' | Arquivo: '+docNome:'');

  // 1. Gravar aprovacao
  var r=await dbAnonIns('caso_aprovacoes',{
    caso_id:cir.caso_id,
    cirurgia_id:lk.cirurgia_id,
    link_token:lk.token,
    tipo:'autorizar_faturamento',
    observacao:observacao,
    aprovado_por:lk.destinatario_nome,
    doc_tipo:tipoDoc,
    doc_nome:docNome,
    doc_data:docData
  });

  if(r.error){
    showAlert('Erro ao registrar: '+r.error.message,'danger');
    if(btn){btn.disabled=false;btn.innerHTML='&#10003; Confirmar Autorizacao';}
    return;
  }

  // 2. Atualizar status da cirurgia para "Faturamento Autorizado"
  var rUpd=await dbAnonUpd('cirurgias',{status:'Faturamento Autorizado'},{id:cir.id});
  if(rUpd.error){

  showAlert('Autorizacao registrada! Status da cirurgia atualizado para Faturamento Autorizado.','success');

}

(async function(){
  var url=localStorage.getItem(SBU),key=localStorage.getItem(SBK);
  if(!url||!key){renderSetup();return;}
  DB.init(url,key);

  // ── Detectar link de caso (?caso=TOKEN) ──────────────────
  var searchParams=new URLSearchParams(window.location.search);
  var casoToken=searchParams.get('caso');
  if(casoToken){
    // Limpar da URL sem recarregar
    history.replaceState(null,null,window.location.pathname);
    // Mostrar portal do devedor
    await renderPortalDevedor(casoToken);
    return;
  }

  // ── Capturar token do hash da URL (link de convite/reset) ──
  var hashStr=window.location.hash||'';
  // Tratar erro de link expirado
  if(hashStr&&hashStr.includes('error=')){
    var errParams={};
    hashStr.replace(/^#/,'').split('&').forEach(function(p){
      var kv=p.split('=');
      errParams[decodeURIComponent(kv[0])]=decodeURIComponent((kv[1]||'').replace(/\+/g,' '));
    });
    history.replaceState(null,null,window.location.pathname+window.location.search);
    // Mostrar tela de login com mensagem de erro
    if(!localStorage.getItem(SBU)||!localStorage.getItem(SBK)){renderSetup();return;}
    DB.init(localStorage.getItem(SBU),localStorage.getItem(SBK));
    if(errParams.error_code==='otp_expired'){
      renderSetup('Link expirado. Use "Esqueci minha senha" para receber um novo link de acesso.');
    } else {
      renderSetup('Erro de autenticacao: '+(errParams.error_description||errParams.error||'Link invalido.'));
    }
    return;
  }
  if(hashStr&&hashStr.includes('access_token=')){
    var params={};
    hashStr.replace(/^#/,'').split('&').forEach(function(p){
      var kv=p.split('=');
      params[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');
    });
    if(params.access_token){
      localStorage.setItem('vt_token',params.access_token);
      if(params.refresh_token)localStorage.setItem('vt_refresh',params.refresh_token);
      history.replaceState(null,null,window.location.pathname+window.location.search);

      // Carregar usuário autenticado
      var authUser=await DB.getUser();
      if(authUser&&authUser.id){
        var perfil=await carregarPerfil(authUser.id,authUser.email);
        S.user={
          id:authUser.id,
          db_id:perfil?perfil.id:'',
          email:authUser.email,
          nome:perfil?perfil.nome:authUser.email.split('@')[0],
          perfil:perfil?perfil.perfil:'operador'
        };
        localStorage.setItem('vt_user',JSON.stringify(S.user));

        // Se veio de link de recovery → mostrar tela de definir senha
        if(params.type==='recovery'){
          renderDefinirSenha();
          return;
        }

        await loadData();
        renderApp();
        showAlert('Bem-vindo ao Virtus!','success');
        return;
      }
    }
  }

  // Verificar se há token salvo e se ainda é válido
  var savedUser=localStorage.getItem('vt_user');
  var token=localStorage.getItem('vt_token');
  if(token&&savedUser){
    // Verificar se o token ainda é válido
    var authUser=await DB.getUser();
    if(authUser&&authUser.id){
      S.user=JSON.parse(savedUser);
      // Atualizar perfil do banco
      var perfil=await carregarPerfil(authUser.id,authUser.email);
      if(perfil){
        S.user.nome=perfil.nome;
        S.user.perfil=perfil.perfil;
        S.user.db_id=perfil.id;
        localStorage.setItem('vt_user',JSON.stringify(S.user));
      }
      await loadData();renderApp();return;
    }
    // Token inválido — tentar refresh
    var refreshed=await DB.refreshToken();
    if(refreshed){
      authUser=await DB.getUser();
      if(authUser){
        S.user=JSON.parse(savedUser);
        await loadData();renderApp();return;
      }
    }
    // Refresh falhou — limpar e pedir login
    localStorage.removeItem('vt_token');
    localStorage.removeItem('vt_refresh');
    localStorage.removeItem('vt_user');
  }
  // Verificar conexão com banco
  var t=await DB.test();
  if(!t.ok){renderSetup('Reconexao falhou: '+t.msg);return;}
  renderSetup(); // Mostrar tela de login
})();
</script>
</body>
</html,
  async signIn(email,password){
    try{
      const r=await fetch(this.url+'/auth/v1/token?grant_type=password',{
        method:'POST',headers:{'Content-Type':'application/json','apikey':this.key},
        body:JSON.stringify({email,password})
      });
      const d=await r.json();
      if(!r.ok)return{ok:false,msg:d.error_description||d.msg||'E-mail ou senha incorretos.'};
      return{ok:true,token:d.access_token,refresh:d.refresh_token,user:d.user};
    }catch(e){return{ok:false,msg:e.message};}
  },
  async signOut(){
    try{
      const tk=localStorage.getItem('vt_token');
      if(tk)await fetch(this.url+'/auth/v1/logout',{
        method:'POST',headers:{'Content-Type':'application/json','apikey':this.key,'Authorization':'Bearer '+tk}
      });
    }catch(e){}
    ['vt_token','vt_refresh','vt_user'].forEach(function(k){localStorage.removeItem(k);});
  },
  async getUser(){
    const tk=localStorage.getItem('vt_token');
    if(!tk)return null;
    try{
      const r=await fetch(this.url+'/auth/v1/user',{
        headers:{'apikey':this.key,'Authorization':'Bearer '+tk}
      });
      return r.ok?await r.json():null;
    }catch(e){return null;}
  },
  async refreshToken(){
    const rf=localStorage.getItem('vt_refresh');
    if(!rf)return false;
    try{
      const r=await fetch(this.url+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:{'Content-Type':'application/json','apikey':this.key},
        body:JSON.stringify({refresh_token:rf})
      });
      const d=await r.json();
      if(!r.ok)return false;
      localStorage.setItem('vt_token',d.access_token);
      localStorage.setItem('vt_refresh',d.refresh_token);
      return true;
    }catch(e){return false;}
  },
  async resetPassword(email){
    try{
      const r=await fetch(this.url+'/auth/v1/recover',{
        method:'POST',headers:{'Content-Type':'application/json','apikey':this.key},
        body:JSON.stringify({email})
      });
      return r.ok;
    }catch(e){return false;}
  }>
